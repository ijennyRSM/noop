name: Build NOOP AI Full Performance UI

on:
  workflow_dispatch:
    inputs:
      capture_previews:
        description: "Capture seeded Thai UI previews"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: noop-ai-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned Full IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v5

      - name: Validate source resources
        run: |
          set -euo pipefail
          python3 Tools/validate-thai-localization.py
          python3 Tools/validate-exercise-library.py
          git diff --check

      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.5.app/Contents/Developer \
            /Applications/Xcode_26.4.1.app/Contents/Developer \
            /Applications/Xcode_26.4.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer
          do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version

      - name: Cache Nomic runtime and model
        uses: actions/cache@v4
        with:
          path: Vendor/Nomic
          key: nomic-${{ hashFiles('Tools/bootstrap-nomic.sh') }}

      - name: Bootstrap pinned Nomic and llama assets
        run: |
          set -euo pipefail
          Tools/bootstrap-nomic.sh

      - name: Install XcodeGen and generate project
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build NOOPiOS for a real iPhone
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Package and verify unsigned IPA
        id: package
        run: |
          set -euo pipefail
          product="build/dd/Build/Products/Release-iphoneos"
          apps=()
          while IFS= read -r -d '' candidate; do apps+=("$candidate"); done \
            < <(find "$product" -maxdepth 1 -type d -name '*.app' -print0)
          [[ ${#apps[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one main iPhone .app; found ${#apps[@]}" >&2
            printf '%s\n' "${apps[@]:-<none>}"
            exit 1
          }
          app="${apps[0]}"
          [[ -f "$app/Info.plist" ]] || { echo "::error::Info.plist missing" >&2; exit 1; }
          [[ ! -e "$app/embedded.mobileprovision" ]] || {
            echo "::error::Provisioning profile found in unsigned build" >&2; exit 1;
          }
          ! codesign -dvv "$app" >/dev/null 2>&1 || {
            echo "::error::Developer signature unexpectedly present" >&2; exit 1;
          }

          find "$app" -name '*.gguf' -type f -print -quit | grep -q . || {
            echo "::error::Nomic GGUF is missing from the app bundle" >&2; exit 1;
          }
          find "$app" -iname '*llama*' -print -quit | grep -q . || {
            echo "::error::llama runtime is missing from the app bundle" >&2; exit 1;
          }
          find "$app" -name 'exercise-library-v1.json' -type f -print -quit | grep -q . || {
            echo "::error::Exercise Library resource is missing" >&2; exit 1;
          }
          find "$app" -path '*th.lproj*' -print -quit | grep -q . || {
            echo "::error::Thai resources are missing" >&2; exit 1;
          }

          # Free-account sideload builds keep the main iPhone app only.
          rm -rf "$app/Watch" "$app/PlugIns"
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/p' project.yml | head -1)"
          [[ -n "$version" ]] || { echo "::error::MARKETING_VERSION missing" >&2; exit 1; }
          short_sha="${GITHUB_SHA:0:7}"
          ipa="NOOP-AI-Full-Thai-Strength-PerformanceUI-v${version}-${short_sha}-unsigned.ipa"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$app" build/ipa/Payload/NOOP.app
          [[ "$(find build/ipa/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" == 1 ]] || {
            echo "::error::Payload must contain exactly one main app" >&2; exit 1;
          }
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$ipa" Payload)
          /usr/bin/unzip -t "$ipa"
          /usr/bin/unzip -Z1 "$ipa" | grep -q '^Payload/NOOP.app/'
          size="$(du -h "$ipa" | awk '{print $1}')"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          {
            echo "## NOOP AI Full Beta"
            echo ""
            echo "- File: \`$ipa\`"
            echo "- Size: $size"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Device build: Release / generic iOS"
            echo "- Signing: disabled"
            echo "- Embedded extensions: removed for free-account sideloading"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-Thai-Strength-PerformanceUI-Unsigned-IPA
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-iOS-Build-Logs
          path: |
            build/xcodebuild.log
            build/dd/Logs/Build/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 14

  previews:
    name: Capture seeded Thai previews
    if: ${{ inputs.capture_previews }}
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Prepare simulator build
        run: |
          set -euo pipefail
          Tools/bootstrap-nomic.sh
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          mkdir -p build
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          [[ -n "$udid" && "$udid" != null ]] || { echo "::error::No iPhone simulator" >&2; exit 1; }
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/preview-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/preview-xcodebuild.log

      - name: Install and capture screens
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r -d '' candidate; do apps+=("$candidate"); done \
            < <(find build/preview-dd/Build/Products/Debug-iphonesimulator \
              -maxdepth 1 -type d -name '*.app' -print0)
          [[ ${#apps[@]} -eq 1 ]] || { echo "::error::Expected one simulator app" >&2; exit 1; }
          app="${apps[0]}"
          rm -rf "$app/Watch" "$app/PlugIns"
          xcrun simctl install "$UDID" "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          mkdir -p build/ui-previews
          xcrun simctl status_bar "$UDID" override --time 14:27 --batteryLevel 85 \
            --wifiBars 3 --cellularBars 4
          screens=(
            root today todayscrolled charge rest effort healthmonitor stress trends
            workouts activitydetail strengthhome strengthlogger exercisepicker bodymap
            coach goal planproposal planbook journey privacy backup settings
            loading empty error
          )
          for screen in "${screens[@]}"; do
            xcrun simctl terminate "$UDID" "$bundle_id" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$bundle_id" \
              --demo-seed --demo-hour 14 --demo-screen "$screen" \
              -AppleLanguages "(th)" -AppleLocale th_TH
            sleep 8
            xcrun simctl io "$UDID" screenshot "build/ui-previews/${screen}.png"
          done

      - name: Upload Thai preview set
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-Thai-UI-Previews
          path: build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload preview diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-Preview-Logs
          path: build/preview-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
