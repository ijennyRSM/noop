name: Build Thai iOS Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-ios:
    name: Build unsigned Thai IPA
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Thai localization
        run: |
          set -euo pipefail
          python3 Tools/validate-thai-localization.py
          python3 Tools/validate-exercise-library.py
          git diff --check

      - name: Cache Nomic runtime and model
        uses: actions/cache@v4
        with:
          path: Vendor/Nomic
          key: nomic-${{ hashFiles('Tools/bootstrap-nomic.sh') }}

      - name: Bootstrap pinned Nomic and llama assets
        run: |
          set -euo pipefail
          Tools/bootstrap-nomic.sh

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build NOOPiOS for a real iPhone device (unsigned Release)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -scheme NOOPiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Thai-iOS-Build-Logs
          path: |
            build/xcodebuild.log
            build/dd/Logs/Build/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 14

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail

          PRODUCT_DIR="build/dd/Build/Products/Release-iphoneos"
          if [[ ! -d "$PRODUCT_DIR" ]]; then
            echo "::error::Device build product directory not found: $PRODUCT_DIR"
            exit 1
          fi

          APPS=()
          while IFS= read -r -d '' candidate; do
            APPS+=("$candidate")
          done < <(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print0)

          if [[ ${#APPS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one main iOS .app in $PRODUCT_DIR; found ${#APPS[@]}"
            printf 'Candidate: %s\n' "${APPS[@]:-<none>}"
            exit 1
          fi

          APP="${APPS[0]}"
          if [[ ! -f "$APP/Info.plist" ]]; then
            echo "::error::Invalid application bundle (Info.plist missing): $APP"
            exit 1
          fi
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP/Info.plist")" != "APPL" ]]; then
            echo "::error::Build product is not an iOS application bundle: $APP"
            exit 1
          fi
          if [[ -e "$APP/embedded.mobileprovision" ]]; then
            echo "::error::Provisioning profile found in unsigned build"
            exit 1
          fi
          if codesign -dvv "$APP" >/dev/null 2>&1; then
            echo "::error::Developer signature unexpectedly present"
            exit 1
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          if [[ "$BUNDLE_ID" != *.noopfull ]]; then
            echo "::error::Expected Full Beta .noopfull bundle identifier, found $BUNDLE_ID"
            exit 1
          fi
          find "$APP" -name '*.gguf' -type f -print -quit | grep -q . || {
            echo "::error::Nomic GGUF is missing from the app bundle"
            exit 1
          }
          find "$APP" -iname '*llama*' -print -quit | grep -q . || {
            echo "::error::llama runtime is missing from the app bundle"
            exit 1
          }
          find "$APP" -name 'exercise-library-v1.json' -type f -print -quit | grep -q . || {
            echo "::error::Exercise Library resource is missing"
            exit 1
          }
          find "$APP" -path '*th.lproj*' -print -quit | grep -q . || {
            echo "::error::Thai resources are missing"
            exit 1
          }

          # Free-account sideloaders commonly cannot provision the embedded Watch app,
          # widget, or Live Activity extension. The core iPhone app remains intact.
          rm -rf "$APP/Watch"
          rm -rf "$APP/PlugIns"

          VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/p' project.yml | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read MARKETING_VERSION from project.yml"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IPA_NAME="NOOP-AI-Full-Thai-Strength-PerformanceUI-v${VERSION}-${SHORT_SHA}-unsigned.ipa"
          IPA_ROOT="build/ipa"

          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP" "$IPA_ROOT/Payload/NOOP.app"

          APP_COUNT="$(find "$IPA_ROOT/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [[ "$APP_COUNT" != "1" || ! -d "$IPA_ROOT/Payload/NOOP.app" ]]; then
            echo "::error::Payload must contain exactly one main app at Payload/NOOP.app"
            exit 1
          fi

          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          /usr/bin/unzip -t "$IPA_NAME"
          ZIP_LIST="$(/usr/bin/unzip -Z1 "$IPA_NAME")"
          grep -q '^Payload/' <<< "$ZIP_LIST"

          IPA_SIZE="$(du -h "$IPA_NAME" | awk '{print $1}')"
          echo "ipa_path=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

          {
            echo "## NOOP AI Full Beta unsigned IPA"
            echo ""
            echo "- File: \`$IPA_NAME\`"
            echo "- Size: $IPA_SIZE"
            echo "- Configuration: Release"
            echo "- Destination: generic iOS device"
            echo "- Signing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-Thai-Strength-PerformanceUI-Unsigned-IPA
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

  previews:
    name: Capture seeded Thai previews
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download previous UI and web reference artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30454093573
          name: NOOP-AI-Full-Thai-UI-Previews
          path: build/visual-inputs/before

      - name: Download authoritative web reference artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30445729550
          name: WHOOP-Real-Web-Reference-Images
          path: build/visual-inputs/reference-pack

      - name: Decode private navigation reference
        env:
          NAV_REFERENCE_B64: ${{ vars.WHOOP_NAV_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          [[ -n "$NAV_REFERENCE_B64" ]] || {
            echo "::error::WHOOP_NAV_REFERENCE_B64 repository variable is missing"
            exit 1
          }
          mkdir -p build/visual-inputs/reference-pack/images
          printf '%s' "$NAV_REFERENCE_B64" | base64 --decode \
            > build/visual-inputs/reference-pack/images/00_PRIORITY_latest_navigation_user_reference.png

      - name: Bootstrap model and build simulator app
        run: |
          set -euo pipefail
          Tools/bootstrap-nomic.sh
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          mkdir -p build
          udid="$(xcrun simctl list devices available -j | jq -r \
            '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          [[ -n "$udid" && "$udid" != null ]] || {
            echo "::error::No available iPhone simulator"
            exit 1
          }
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          set +e
          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/preview-dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/preview-xcodebuild.log
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Test performance root navigation
        run: |
          set -euo pipefail
          xcodebuild \
            -project Strand.xcodeproj \
            -scheme NOOPiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/preview-dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:NOOPiOSTests/PerformanceRootNavigationTests \
            test 2>&1 | tee build/performance-navigation-tests.log

      - name: Install and capture screens
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r -d '' candidate; do apps+=("$candidate"); done \
            < <(find build/preview-dd/Build/Products/Debug-iphonesimulator \
              -maxdepth 1 -type d -name '*.app' -print0)
          [[ ${#apps[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one simulator app; found ${#apps[@]}"
            exit 1
          }
          app="${apps[0]}"
          rm -rf "$app/Watch" "$app/PlugIns"
          xcrun simctl install "$UDID" "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          mkdir -p build/ui-previews
          # The performance UI is designed and visually regression-tested in the same
          # dark appearance used by the WHOOP-style dashboard. Production still follows
          # the user's system appearance.
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override \
            --time 14:27 --batteryLevel 85 --wifiBars 3 --cellularBars 4
          screens=(root today todayscrolled charge rest effort)
          for screen in "${screens[@]}"; do
            xcrun simctl terminate "$UDID" "$bundle_id" >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" "$bundle_id" \
              --demo-seed --demo-hour 14 --demo-screen "$screen" \
              -AppleLanguages "(th)" -AppleLocale th_TH
            sleep 8
            xcrun simctl io "$UDID" screenshot "build/ui-previews/${screen}.png"
          done
          expected="${#screens[@]}"
          actual="$(find build/ui-previews -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Expected $expected screenshots; captured $actual"
            exit 1
          }

      - name: Assemble visual-fidelity comparison
        run: |
          set -euo pipefail
          comparison="build/visual-fidelity-milestone-1"
          mkdir -p "$comparison/reference" "$comparison/before" "$comparison/after"
          cp build/visual-inputs/reference-pack/images/00_PRIORITY_latest_navigation_user_reference.png \
            "$comparison/reference/00-navigation.png"
          cp build/visual-inputs/reference-pack/images/01_google_play_current_01.jpg \
            "$comparison/reference/01-home.jpg"
          for screen in root today todayscrolled charge rest effort; do
            cp "build/visual-inputs/before/${screen}.png" "$comparison/before/${screen}.png"
            cp "build/ui-previews/${screen}.png" "$comparison/after/${screen}.png"
          done
          cp docs/ui-redesign/VISUAL_FIDELITY_MILESTONE_1.md "$comparison/MEASURED_DIFFERENCES.md"
          {
            echo ""
            echo "## Build identity"
            echo ""
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Reference priority: 00 navigation, then 01 home"
            echo "- Captured screens: root, today, todayscrolled, charge, rest, effort"
          } >> "$comparison/MEASURED_DIFFERENCES.md"

      - name: Upload Thai Milestone 1 preview set
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Visual-Fidelity-Milestone-1-Previews
          path: build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload reference-before-after comparison
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-Visual-Fidelity-Milestone-1-Comparison
          path: build/visual-fidelity-milestone-1
          if-no-files-found: error
          retention-days: 14

      - name: Upload preview diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-AI-Full-Preview-Logs
          path: |
            build/preview-xcodebuild.log
            build/performance-navigation-tests.log
          if-no-files-found: ignore
          retention-days: 14
